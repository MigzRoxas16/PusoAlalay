name: Build PusoAlalay APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship with the Android SDK in $ANDROID_HOME.
      - name: Install SDK Platform 35 and Build Tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Uses Gradle 8.11.1 directly (same version as the wrapper), so the build
      # also works if gradle-wrapper.jar was not uploaded.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify and rename APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -n 3
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/PusoAlalay-v1.2.2.apk
          sha256sum dist/PusoAlalay-v1.2.2.apk | tee dist/PusoAlalay-v1.2.2.apk.sha256

      - name: Show Room schema (checks the 1 to 2 migration)
        run: cat app/schemas/ph.pusoalalay.app.data.HealthDatabase/2.json || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PusoAlalay-v1.2.2
          path: dist/

      - name: Publish APK as a GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: PusoAlalay 1.2.2
          prerelease: false
          make_latest: true
          files: dist/PusoAlalay-v1.2.2.apk
          body: |
            For personal installation and testing on Android 8.0 or later (signed with a development key, not a Play Store release).
            Download PusoAlalay-v1.2.2.apk on your phone, open it, and allow installing unknown apps.
            Screenshots and screen recording are now allowed.
            Academic prototype: a personal health journal, not a diagnostic or medical device.

      # Runs after the APK is uploaded, so a lint failure never hides the APK, but it does mark the run as failed.
      - name: Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
